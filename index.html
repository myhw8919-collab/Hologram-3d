<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hologram Prototype</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            color: #00d4ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* De container die we gaan spiegelen */
        #hologram-stage {
            position: relative;
            width: 80vw;
            height: 80vw;
            max-width: 400px;
            max-height: 400px;
            /* CRUCIAL: Flip het beeld verticaal voor de spiegeling */
            transform: scaleY(-1);
            border: 1px dashed #333; /* Hulplijntje voor plaatsing plastic */
        }

        .ai-avatar {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Blauwe neon glow voor het sci-fi effect */
            filter: drop-shadow(0 0 15px #00d4ff) brightness(1.2);
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .ui-overlay {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            transform: scaleY(-1); /* UI moet ook leesbaar zijn in spiegel */
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .instruction-box {
            position: fixed;
            bottom: 20px;
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #00d4ff;
            text-align: center;
            max-width: 80%;
        }
    </style>
</head>
<body>

    <div id="hologram-stage">
        <div class="ui-overlay">AI Mentor: Ji-woo</div>
        <img src="https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJqZ3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z3R4Z/3o7TKMGpxPuc95dYpa/giphy.gif" class="ai-avatar" alt="Hologram">
    </div>

    <div class="instruction-box">
        <p><strong>TEST INSTRUCTIE:</strong></p>
        <p>Leg je telefoon plat. Houd een doorzichtig plastic plaatje in een hoek van 45° boven het figuur. Kijk in het plastic.</p>
    </div>

</body>
</html>
